name: Build and test WendySwift

on:
  workflow_call:
    inputs:
      test-host:
        type: boolean
        default: true
      artifact-prefix:
        type: string
        default: test-core

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04, swift-image: 'swift:6.2.1-jammy' }
          - { target: linux-arm64, os: ubuntu-24.04-arm, swift-image: 'swift:6.2.1-noble' }
          - { target: macos, os: macos-15 }
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the immutable WendyOS Core pin
        id: core
        run: echo "revision=$(cat scripts/core-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: wendylabsinc/WendyOS
          ref: ${{ steps.core.outputs.revision }}
          path: .build/WendyOS
          sparse-checkout: go/wendy-core
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .build/WendyOS/go/wendy-core/.go-version
          cache-dependency-path: .build/WendyOS/go/wendy-core/go.sum
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Build Core using its own Swift packaging
        env:
          TEST_HOST: ${{ inputs.test-host && '--test-host' || '' }}
        run: |
          if [ -n "$TEST_HOST" ]; then
            python3 scripts/build-core.py --test-host
          else
            python3 scripts/build-core.py
          fi
      - if: runner.os == 'Linux'
        name: Run Swift tests against the built Core
        env:
          SWIFT_IMAGE: ${{ matrix.swift-image }}
          WENDY_BRIDGE_TESTS: ${{ inputs.test-host && '1' || '0' }}
        run: docker run --rm -e WENDY_BRIDGE_TESTS -e WENDY_CORE_PATH=/src/.build/WendyOS/go/wendy-core -v "$PWD:/src" -w /src "$SWIFT_IMAGE" swift test --scratch-path /tmp/swift
      - if: runner.os == 'macOS'
        name: Test macOS
        env:
          WENDY_BRIDGE_TESTS: ${{ inputs.test-host && '1' || '0' }}
        run: swift test
      - if: runner.os == 'macOS'
        name: Compile and link tests for iOS and iOS Simulator without booting
        env:
          WENDY_BRIDGE_TESTS: ${{ inputs.test-host && '1' || '0' }}
        run: |
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            xcodebuild build-for-testing -quiet -scheme wendy-swift-Package \
              -destination "$destination" -derivedDataPath .build/ios
          done
      - if: inputs.test-host
        name: Rebuild production archives without the test caller
        run: python3 scripts/build-core.py
      - if: inputs.test-host && runner.os == 'Linux'
        name: Verify the production Core on Linux
        env:
          SWIFT_IMAGE: ${{ matrix.swift-image }}
        run: docker run --rm -v "$PWD:/src" -w /src "$SWIFT_IMAGE" swift test --scratch-path /tmp/production-swift
      - if: inputs.test-host && runner.os == 'macOS'
        name: Verify the production Core on macOS
        run: swift test
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-macos
          path: .build/WendyOS/go/wendy-core/.build/native/darwin-arm64/CWendyCore.xcframework.zip
          if-no-files-found: error
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          path: .build/WendyOS/go/wendy-core/distributions/swift/artifacts/CWendyCore.artifactbundle
          if-no-files-found: error
