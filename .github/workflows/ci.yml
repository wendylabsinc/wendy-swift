name: WendySwift CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wendy-swift-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Temporary: revert to the released dependency after Wendy Core 0.1.0 ships.
  WENDY_CORE_REF: 19fd8e515256a9b52204026a91961c3569fb1894

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux tests run in the official Swift image matching the runner's glibc.
          - { os: ubuntu-22.04, swift-image: 'swift:6.2.1-jammy' }
          - { os: ubuntu-24.04-arm, swift-image: 'swift:6.2.1-noble' }
          - { os: macos-15 }
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wendylabsinc/wendy-core
          ref: ${{ env.WENDY_CORE_REF }}
          path: wendy-core
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: wendy-core/.go-version
          cache: false
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Build Wendy Core's Swift binaries for this platform
        run: python3 wendy-core/scripts/build.py swift
      - if: runner.os == 'Linux'
        name: Test
        env:
          SWIFT_IMAGE: ${{ matrix.swift-image }}
        run: docker run --rm -e WENDY_CORE_PATH=/src/wendy-core -v "$PWD:/src" -w /src "$SWIFT_IMAGE" swift test --scratch-path /tmp/swift
      - if: runner.os == 'macOS'
        name: Test
        run: WENDY_CORE_PATH="$PWD/wendy-core" swift test
      - if: runner.os == 'macOS'
        name: Compile and link the tests for iOS and the iOS Simulator
        run: |
          for destination in 'generic/platform=iOS' 'generic/platform=iOS Simulator'; do
            WENDY_CORE_PATH="$PWD/wendy-core" xcodebuild build-for-testing -quiet -scheme wendy-swift \
              -destination "$destination" -derivedDataPath .build/ios
          done
