name: WendySwift CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wendy-swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
  package:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: test-core-*
          path: .build/downloads
      - name: Assemble and consume the release archive layout
        run: |
          python3 scripts/release.py collect --prefix test-core-
          python3 scripts/release.py assemble
          docker run --rm -v "$PWD:/src" -w /src swift:6.2.1-noble python3 scripts/smoke.py .build/release-assets
