name: WendySwift CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wendy-swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
